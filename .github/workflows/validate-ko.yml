name: Validate Korean Course

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile sync helpers
        run: |
          python -m py_compile scripts/build_course_manifest.py
          python -m py_compile scripts/verify_ko_course.py

      - name: Check whether upstream changed
        run: |
          set +e
          python scripts/build_course_manifest.py --check docs/ko/course-manifest.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo 'Upstream changed since the processed baseline. Korean content validation will still run.'
            exit 0
          fi
          exit "$code"

      - name: Validate Korean course
        run: python scripts/verify_ko_course.py
