name: Validate Korean Course

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile sync helper
        run: python -m py_compile scripts/build_course_manifest.py

      - name: Check upstream manifest baseline
        run: |
          set +e
          python scripts/build_course_manifest.py --check docs/ko/course-manifest.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo 'Upstream changed since the processed baseline. This does not make the Korean content PR invalid.'
            exit 0
          fi
          exit "$code"

      - name: Validate Markdown hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote

          root = Path('.').resolve()
          files = [Path('README.ko.md'), *sorted(Path('docs/ko').rglob('*.md'))]
          zero = re.compile(r'[\u200B-\u200D\uFEFF]')
          heading = re.compile(r'^(#{1,6})\s+', re.M)
          link = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          errors = []

          for path in files:
              text = path.read_text(encoding='utf-8')
              if zero.search(text):
                  errors.append(f'{path}: zero-width character')
              if '\t' in text:
                  errors.append(f'{path}: tab character')
              if len(re.findall(r'^```', text, re.M)) % 2:
                  errors.append(f'{path}: unbalanced code fence')

              if path.name != 'README.ko.md':
                  levels = [len(m.group(1)) for m in heading.finditer(text)]
                  for a, b in zip(levels, levels[1:]):
                      if b > a + 1:
                          errors.append(f'{path}: heading jump H{a}->H{b}')
                          break

              for m in link.finditer(text):
                  raw = m.group(1).strip()
                  if not raw or raw.startswith(('#', 'http://', 'https://', 'mailto:', 'tel:')):
                      continue
                  target = raw.split()[0].strip('<>')
                  target = unquote(target.split('#', 1)[0])
                  if not target:
                      continue
                  resolved = (path.parent / target).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      errors.append(f'{path}: link escapes repository: {raw}')
                      continue
                  if not resolved.exists():
                      errors.append(f'{path}: broken relative link: {raw}')

          print(f'Markdown files checked: {len(files)}')
          print(f'Errors: {len(errors)}')
          for error in errors:
              print('ERROR:', error)
          sys.exit(1 if errors else 0)
          PY
